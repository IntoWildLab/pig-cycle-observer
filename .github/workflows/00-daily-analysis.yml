name: 猪周期观察-云端每日分析

on:
  schedule:
    - cron: '40 15 * * 1,3,5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 非交易日强制运行
        required: false
        default: false
        type: boolean
      send_email:
        description: 发送分析邮件
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pig-cycle-observer-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 分析猪周期观察标的
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GENERATION_BACKEND: ${{ secrets.GENERATION_BACKEND }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          SEARXNG_PUBLIC_INSTANCES_ENABLED: 'false'
          PIG_CYCLE_RUN_SOURCE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: |
          set -euo pipefail

          if [ -z "${STOCK_LIST:-}" ]; then
            echo "STOCK_LIST 未配置，取消运行。" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            python main.py --stocks "$STOCK_LIST" --no-market-review
            exit $?
          fi

          args=(main.py --stocks "$STOCK_LIST" --no-market-review)

          if [ "${{ inputs.force_run }}" = "true" ]; then
            args+=(--force-run)
          fi

          if [ "${{ inputs.send_email }}" != "true" ]; then
            args+=(--no-notify)
          fi

          python "${args[@]}"
